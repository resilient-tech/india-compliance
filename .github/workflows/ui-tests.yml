name: UI Tests

on:
  pull_request:

  push:
    branches:
      [
        develop,
        version-14-hotfix,
        version-14,
        version-15-hotfix,
        version-15,
        version-16-hotfix,
        version-16,
      ]

  workflow_dispatch:

env:
  BRANCH: ${{ github.base_ref || github.ref_name }}
  SITE: test_site

concurrency:
  group: ui-tests-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect UI-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ui:
              - '**'
              - '!**.md'
              - '!**.csv'

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ui == 'true' }}

    name: Playwright UI Tests

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: "travis"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 ${{ env.SITE }}" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install
        run: |
          bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          BRANCH_TO_CLONE: ${{ env.BRANCH }}

      - name: Resolve dev server port
        working-directory: /home/runner/frappe-bench
        run: |
          PORT=$(awk '/^web:/ { for (i = 1; i < NF; i++) if ($i == "--port") print $(i + 1) }' Procfile)
          echo "UI_PORT=${PORT:-8000}" >> "$GITHUB_ENV"
          echo "dev server port: ${PORT:-8000}"

      - name: Configure site and seed test records
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site "$SITE" set-config allow_tests true
          bench --site "$SITE" set-config host_name "http://$SITE:$UI_PORT"
          # hooks.before_tests: setup wizard, test_records.json, GST sandbox mode.
          # `bench run-tests` calls this for the Python suite; UI tests need it
          # invoked explicitly.
          bench --site "$SITE" execute india_compliance.tests.before_tests

      # install.sh runs `bench init --skip-assets`, which the server tests can live
      # with. The desk cannot — and this needs frappe's and ERPNext's bundles too,
      # so `--app india_compliance` alone is not enough.
      - name: Build assets
        working-directory: /home/runner/frappe-bench
        run: bench build

      - name: Wait for the dev server
        run: |
          timeout 120 bash -c \
            "until curl -sf http://$SITE:$UI_PORT/api/method/ping > /dev/null; do sleep 2; done"
          echo "UI test server ready on :$UI_PORT"

      - name: Install Playwright
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: yarn test:e2e
        env:
          SITE: ${{ env.SITE }}
          SITE_PORT: ${{ env.UI_PORT }}
          FRAPPE_USER: Administrator
          ADMIN_PASSWORD: admin

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (traces, videos)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Show server logs
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: |
          echo "=== Error Log (unhandled server exceptions) ==="
          bench --site "$SITE" execute frappe.client.get_list --kwargs \
            "{'doctype':'Error Log','fields':['creation','method','error'],'limit_page_length':20,'order_by':'creation desc'}" || true
          echo "=== frappe.log ==="; tail -n 200 logs/frappe.log || true
          echo "=== worker.error.log ==="; tail -n 100 logs/worker.error.log || true
